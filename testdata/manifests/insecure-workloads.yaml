apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-deployment
  template:
    metadata:
      labels:
        app: insecure-deployment
    spec:
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            runAsNonRoot: true
            # 缺省 allowPrivilegeEscalation —— 应命中
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: insecure-cronjob
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          hostPID: true
          restartPolicy: OnFailure
          containers:
            - name: job
              image: busybox:1.36
              securityContext:
                allowPrivilegeEscalation: true
