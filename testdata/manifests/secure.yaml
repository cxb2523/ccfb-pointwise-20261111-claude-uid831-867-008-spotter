apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: default
spec:
  hostNetwork: false
  hostPID: false
  containers:
    - name: app
      image: nginx:1.25
      securityContext:
        allowPrivilegeEscalation: false
  initContainers:
    - name: init
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-deployment
  template:
    metadata:
      labels:
        app: secure-deployment
    spec:
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secure-cronjob
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: job
              image: busybox:1.36
              securityContext:
                allowPrivilegeEscalation: false
